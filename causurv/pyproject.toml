[project]
name = "causurv"
version = "0.0.0"
description = "Causal survival analysis."
readme = "../README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Anna Weller", email = "anna.weller@scai.fraunhofer.de" },
    { name = "Jannis Guski", email = "jannis.guski@scai.fraunhofer.de" },
    { name = "Lennart Carstens-Behrens", email = "lennart.carstens-behrens@scai.fraunhofer.de" },
]
dependencies = [
    "tausurv",
    "numpy>=2.0",
]

[tool.uv.sources]
tausurv = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["causurv"]

[tool.hatch.build.targets.sdist]
include = [
    { path = "causurv/py.typed", format = "sdist" },
]
