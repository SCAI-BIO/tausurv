[project]
name = "tausurv"
version = "0.1.0"
description = "A complete survival analysis library for Python: nonparametric estimators, regression models, tree ensembles and neural networks, with support for competing risks."
readme = "../README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anna Malewski", email = "anna.malewski@scai.fraunhofer.de" },
    { name = "Jannis Barking", email = "jannis.barking@scai.fraunhofer.de" },
    { name = "Lennart Carstens-Behrens", email = "lennart.carstens-behrens@scai.fraunhofer.de" },
]
keywords = [
    "survival analysis",
    "time-to-event",
    "competing risks",
    "censoring",
    "kaplan-meier",
    "cox regression",
    "random survival forest",
    "deep learning",
    "biostatistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "polars>=1.0",
    "platformdirs>=4.0",
    "tqdm>=4.65",
]

[project.urls]
Documentation = "https://scai-bio.github.io/tausurv/"
Repository = "https://github.com/SCAI-BIO/tausurv"
Issues = "https://github.com/SCAI-BIO/tausurv/issues"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]
boost = [
    "scikit-learn>=1.4",
]
# The DeepSurv benchmark tables (metabric, gbsg:deepsurv, support:deepsurv,
# whas:deepsurv) are distributed as HDF5 and only those four need this.
deepsurv = [
    "h5py>=3.0",
]
tune = [
    "optuna>=3.0",
]

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../crates/tausurv-pyo3/Cargo.toml"
python-source = "."
module-name = "tausurv._tausurv_core"
bindings = "pyo3"
features = ["pyo3/extension-module"]
include = [
    { path = "tausurv/_tausurv_core.pyi", format = "sdist" },
    { path = "tausurv/py.typed", format = "sdist" },
]
